<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Penwright</title>
    <link rel="stylesheet" href="../ui/page.css" />
    <style>
      body { width: 320px; }
      .band-inner { padding: 14px 16px 12px; }
      .wordmark { font-size: 17px; }
      main { padding: 14px 16px 16px; }
      .row { grid-template-columns: 1fr auto; margin-bottom: 10px; }
      .conn { font-size: 12px; color: var(--subtle); margin-bottom: 12px; overflow-wrap: anywhere; }
      .conn b { color: var(--text); }
      .warn { border-left-color: var(--danger); }
      select { width: 150px; }
    </style>
  </head>
  <body>
    <header class="band">
      <div class="band-inner"><div class="wordmark">Penwright<small>Writing assistant</small></div></div>
    </header>
    <main>
      <div class="conn" id="conn"></div>
      <div class="callout warn" id="warn" hidden></div>
      <div class="row">
        <label for="site" id="siteLabel">Enabled on this site</label>
        <input id="site" type="checkbox" />
      </div>
      <div class="row">
        <label for="autoCheck">Check as I type</label>
        <input id="autoCheck" type="checkbox" />
      </div>
      <div class="row">
        <label for="tone">Rewrite tone</label>
        <select id="tone"></select>
      </div>
      <div class="label" style="margin: 6px 0 4px">Formality · <span id="formalityLabel"></span></div>
      <input id="formality" type="range" min="1" max="5" step="1" />
      <p style="margin: 14px 0 0"><button class="btn primary" id="options" style="width: 100%">All settings</button></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
