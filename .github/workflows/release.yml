# Build, test, package, and publish Penwright to the Chrome Web Store, Microsoft Edge
# Add-ons, and Firefox Add-ons (AMO). Written for Gitea Actions, which reads
# .github/workflows/ when the repo has no .gitea/workflows/. Also runs on GitHub Actions.
#
# Versions live in git tags (vX.Y.Z), not in the repo files. The workflow computes the
# next version from the latest tag and stamps it into the manifest and package.json for
# the build only. Once the build succeeds it tags the commit.
#   push to master/main            -> patch bump (no publish)
#   Run workflow (release action)  -> minor bump, patch reset; tick "publish" to submit
# To re-publish an old version, re-run the publish jobs of that run: they download its
# stored "packages" artifact. Setup and secrets: docs/development.md#releasing
name: release

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the stores
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Next version from latest tag
        id: version
        run: |
          git fetch --tags --force
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          # No tag yet: start from the version in package.json.
          last=${last:-v$(node -p "require('./package.json').version")}
          IFS=. read -r major minor patch <<< "${last#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            next="$major.$((minor + 1)).0"
          else
            next="$major.$minor.$((patch + 1))"
          fi
          echo "$last -> v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          npm pkg set version="$next"
          node -e "const f='src/manifest.json',m=JSON.parse(require('fs').readFileSync(f));m.version='$next';require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\\n')"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run zip
      # v3: Gitea's artifact server implements the v3 protocol.
      - uses: actions/upload-artifact@v3
        with:
          name: packages
          path: dist/

  # Runs only after the build and tests pass.
  tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag "v${{ needs.build.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ needs.build.outputs.version }}"

  chrome:
    needs: build
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v3
        with:
          name: packages
          path: dist/
      - run: node scripts/publish.mjs chrome dist/penwright-*-chromium.zip
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}

  edge:
    needs: build
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v3
        with:
          name: packages
          path: dist/
      - run: node scripts/publish.mjs edge dist/penwright-*-chromium.zip
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}

  firefox:
    needs: build
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v3
        with:
          name: packages
          path: dist/
      # Submits the listed version for review and exits (approval is not awaited).
      # amo-metadata.json is only needed the first time, when AMO creates the listing.
      - run: >-
          npx web-ext sign --channel listed --source-dir dist/firefox --artifacts-dir dist/signed
          --amo-metadata scripts/amo-metadata.json --approval-timeout 0
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
